<div class="flex flex-col items-center text-center max-w-md px-6">

  <h1 class="text-2xl font-semibold mt-2">È disponibile una nuova applicazione!</h1>

  <p class="mt-4 text-gray-600">
    Da ora puoi gestire i tuoi timesheet e accedere a nuove funzionalità dalla nostra nuova applicazione.
