<div>
  <form #form="ngForm" class="flex flex-col min-w-80">
    <mat-form-field appearance="outline">
      <mat-label>Email/Username</mat-label>
      <input class="ml-2" matInput ngModel required name="username" type="text" placeholder="Email/Username" />
    </mat-form-field>
    <button (click)="requestPasswordReset(form.value)" class="px-4 py-2 bg-black text-white rounded hover:bg-gray-800 transition-colors cursor-pointer">
      Richiedi modifica password
    </button>
  </form>
</div>
