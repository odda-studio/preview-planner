@if (show()) {
  <div class="right-sidenav" animate.leave="leave-animation" animate.enter="enter-animation">
    <div class="flex justify-between p-4 flex-shrink-0 border-b border-gray-200">
      <div class="text-xl font-semibold">
        {{title()}}
      </div>
      <div>
        <button class="cursor-pointer hover:bg-gray-100 rounded p-1 transition-colors" (click)="show.set(false)">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6">
            <path fill-rule="evenodd" d="M5.47 5.47a.75.75 0 0 1 1.06 0L12 10.94l5.47-5.47a.75.75 0 1 1 1.06 1.06L13.06 12l5.47 5.47a.75.75 0 1 1-1.06 1.06L12 13.06l-5.47 5.47a.75.75 0 0 1-1.06-1.06L10.94 12 5.47 6.53a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd" />
          </svg>
        </button>
      </div>
    </div>
    <div class="sidenav-content">
      <ng-content></ng-content>
    </div>
  </div>
  <div class="h-dvh w-dvw bg-[#00000038] top-0 left-0 fixed" (click)="show.set(false)"></div>
}
